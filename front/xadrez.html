<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xadrez - Jogos Educativos</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/xadrez.css">
</head>
<body>
  <div class="pagina pagina--topo">
    <header class="barra">
      <a class="botao-link" href="home.html">Voltar aos jogos</a>
      <p class="barra__nome">Jogando como <strong>Ana Souza</strong></p>  <!-- BACK-END: nome do usuário -->
    </header>

    <main class="xadrez">
      <section class="xadrez__tabuleiro" aria-label="Tabuleiro de xadrez">
        <p id="mensagem" class="status" role="status" aria-live="polite">Carregando o tabuleiro...</p>
        <div id="tabuleiro" class="tabuleiro" role="grid" aria-label="Tabuleiro"></div>
        <p class="dica">Toque numa peça para ver onde ela pode ir. Use as setas do teclado para andar pelo tabuleiro e Enter para escolher.</p>
      </section>

      <aside class="xadrez__painel cartao">
        <h1>Xadrez</h1>

        <form id="opcoes" class="opcoes" onsubmit="return false">
          <label for="modo">Quem joga contra você?</label>
          <select id="modo">
            <option value="dois">Um colega (neste computador)</option>
            <option value="pc" selected>O computador</option>
          </select>

          <div id="opcoes-pc">
            <label for="nivel">Nível do computador</label>
            <select id="nivel">
              <option value="facil">Fácil</option>
              <option value="medio" selected>Médio</option>
              <option value="dificil">Difícil</option>
            </select>

            <label for="cor">Sua cor</label>
            <select id="cor">
              <option value="w" selected>Brancas (você começa)</option>
              <option value="b">Pretas</option>
            </select>
          </div>
        </form>

        <div class="acoes">
          <button type="button" id="novo">Novo jogo</button>
          <button type="button" id="desfazer" class="secundario">Desfazer jogada</button>
          <button type="button" id="virar" class="secundario">Virar tabuleiro</button>
        </div>

        <h2>Jogadas</h2>
        <ol id="lista" class="lista-jogadas" aria-label="Jogadas feitas"></ol>
        <p id="vazio" class="sub">Nenhuma jogada ainda.</p>
      </aside>
    </main>
  </div>

  <div id="promocao" class="promocao" role="dialog" aria-modal="true" aria-labelledby="promocao-titulo" hidden>
    <div class="promocao__caixa">
      <h2 id="promocao-titulo">Seu peão chegou ao fim! Escolha a nova peça:</h2>
      <div class="promocao__opcoes">
        <button type="button" data-peca="Q">Rainha</button>
        <button type="button" data-peca="R">Torre</button>
        <button type="button" data-peca="B">Bispo</button>
        <button type="button" data-peca="N">Cavalo</button>
      </div>
    </div>
  </div>

  <script src="js/xadrez-motor.js"></script>
  <script src="js/xadrez.js"></script>
</body>
</html>
